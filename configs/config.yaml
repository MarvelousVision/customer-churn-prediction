data:
    random_state: 42 
    target: 'Churn'
    target_mapping:
       "No": 0
       "Yes": 1

model:  
    type: catboost
logistic_regression:
  C: 0.1
  max_iter: 1000
  solver: lbfgs
  random_state: 42

random_forest:
  n_estimators: 100
  max_depth: 15
  min_samples_split: 10
  min_samples_leaf: 20
  max_features: 0.7
  random_state: 42

decision_tree:
  criterion: gini
  max_depth: 15
  min_samples_split: 10
  min_samples_leaf: 20
  max_features: 0.7
  random_state: 42

catboost:
  iterations: 60
  depth: 8
  learning_rate: 0.03
  verbose: 0
  min_data_in_leaf: 72

profit:
  gain: 100
  cost: 20
  loss: 200

features:
    scale_numeric: true
    handle_unknown: "ignore"
    age_bins: 5 
split:
  train: 0.70
  validation: 0.15
  test: 0.15